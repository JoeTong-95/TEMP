name: issue-256 live frontier verification

on:
  workflow_dispatch:

# Unspecified permissions remain none.
permissions: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
    env:
      EPHEMERAL_JOB_TOKEN: ${{ github.token }}
      EXPECTED_SOURCE_BUNDLE_SHA256: 17ce51276d2b0818dcbafb458f2f286c656b9f27d40c2ed756e5af6ae0d8a0cf
      EXPECTED_AGENT_INFRASTRUCTURE_REVISION: ea3c780741c5e2e70470f5389d130a4495517464
      SOURCE_BUNDLE: .github/verification/agent-infrastructure-source.tar.gz
      VERIFICATION_WORKSPACE: .verify
    steps:
      - name: Checkout disposable verification inputs
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify candidate binding and run production replay
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${GH_TOKEN:-}" || -n "${GITHUB_TOKEN:-}" ]]; then
            echo "broad token environment is present; refusing to run"
            exit 1
          fi
          if [[ -z "${EPHEMERAL_JOB_TOKEN:-}" || "${GITHUB_ACTIONS:-}" != "true" || "${GITHUB_REPOSITORY:-}" != "JoeTong-95/TEMP" || -z "${GITHUB_RUN_ID:-}" ]]; then
            echo "explicit ephemeral GitHub Actions boundary is missing"
            exit 1
          fi
          mkdir -p .verify/source
          actual_bundle_sha256="$(sha256sum "${SOURCE_BUNDLE}" | awk '{print $1}')"
          if [[ "${actual_bundle_sha256}" != "${EXPECTED_SOURCE_BUNDLE_SHA256}" ]]; then
            echo "candidate source bundle digest mismatch"
            exit 1
          fi
          tar -xzf "${SOURCE_BUNDLE}" -C .verify/source
          python3 .github/verification/verify_frontier.py